openapi: 3.1.0
info:
  title: PointSite Builder API
  version: 1.0.0
  description: Private API using GitHub collaborator sessions. All mutation responses include a request ID.
servers:
  - url: /api
security:
  - githubSession: []
paths:
  /feedback:
    get:
      operationId: getFeedbackAvailability
      responses:
        '200':
          description: Role-filtered feedback availability; no operational configuration or secrets
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode: { type: string, enum: [disabled, pilot, production] }
        '401': { $ref: '#/components/responses/Error' }
  /feedback/launch:
    post:
      operationId: createFeedbackLaunch
      description: Requires same-origin JSON, Fetch Metadata, and authenticated authorization. No draft or identity data is accepted. The transient assertion must only be sent as launch_token in an HTTPS form POST; never store or log it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [screen]
              properties:
                screen:
                  type: string
                  enum:
                    [
                      dashboard,
                      editor.layout,
                      editor.forms,
                      editor.library,
                      editor.preview,
                      editor.history,
                      editor.settings,
                      editor.admin,
                    ]
      responses:
        '200':
          description: Private no-store launch assertion, valid for 120 seconds
          content:
            application/json:
              schema:
                type: object
                required: [action, launchToken]
                properties:
                  action: { type: string, format: uri }
                  launchToken: { type: string, maxLength: 5000 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Process health without private state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Authenticated identity and application role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Actor' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /drafts:
    get:
      operationId: listDrafts
      responses:
        '200':
          description: Draft summaries visible to actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftList'
    post:
      operationId: createDraft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                fromRevisionId: { type: string, format: uuid }
      responses:
        '201':
          description: Created draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      operationId: getDraft
      responses:
        '200':
          description: Draft and latest immutable revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveDraft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: Current revision checksum in quotes
        - $ref: '#/components/parameters/CheckoutToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: The canonical serialized document must not exceed 1,500,000 bytes.
              required: [document, action]
              properties:
                document: { $ref: '#/components/schemas/SiteDocument' }
                action: { $ref: '#/components/schemas/DraftAction' }
                label: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Saved revision or idempotent prior result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateDraftLifecycle
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                status: { type: string, enum: [active, archived] }
      responses:
        '200':
          description: Updated draft lifecycle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
    delete:
      operationId: purgeArchivedDraft
      description: >-
        Requires an archived draft and exact typed DELETE confirmation. Permanently purges the
        complete private workspace, all retained revisions, Library records and binary versions,
        editor state, private publication preparation and cached content responses. Completed
        Staging and Production copies are independent and remain unchanged. An active publication
        lease blocks purge. Retains only a content-free deletion receipt; no recovery window.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { type: string, const: DELETE }
      responses:
        '200':
          description: Complete archived workspace purged, or content-free receipt from a prior purge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedDraftReceipt' }
        '409':
          description: Draft is not archived, has an active checkout, or publication is in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /drafts/{draftId}/revisions:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      operationId: listRevisions
      responses:
        '200':
          description: Revision metadata newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
  /drafts/checkouts:
    get:
      operationId: listDraftCheckouts
      responses:
        '200':
          description: Content-free checkout availability for visible drafts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    { type: array, items: { $ref: '#/components/schemas/CheckoutAvailability' } }
  /drafts/checkout/owned:
    get:
      operationId: getOwnedDraftCheckout
      responses:
        '200':
          description: Current actor-owned checkout locator, or null
  /drafts/{draftId}/checkout:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      operationId: validateDraftCheckout
      parameters:
        - $ref: '#/components/parameters/CheckoutToken'
      responses:
        '200': { description: Current editing client still owns the checkout }
        '409': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
    post:
      operationId: acquireDraftCheckout
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutClient' }
      responses:
        '200': { description: 'Acquired, resumed, or transferred checkout' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      operationId: renewDraftCheckout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CheckoutToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutClient' }
      responses:
        '200': { description: Renewed checkout and persisted safe view state }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: releaseDraftCheckout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CheckoutToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutClient' }
      responses:
        '204': { description: Released or already absent }
  /drafts/{draftId}/revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
      - name: revisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: labelRevision
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Revision metadata with an immutable label record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revision' }
  /drafts/{draftId}/restore:
    parameters:
      - $ref: '#/components/parameters/DraftId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: restoreRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revisionId, expectedChecksum]
              properties:
                revisionId: { type: string, format: uuid }
                expectedChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Restored content as a new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '412': { $ref: '#/components/responses/Error' }
  /drafts/{draftId}/library:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      operationId: listDraftLibrary
      description: >-
        Viewer access. Returns the complete owner-scoped mixed inventory, including archived
        items and inventories larger than 100 items. No pagination or shared upload history.
        Usage counts represent placements in this draft only. No private storage keys are returned.
      responses:
        '200':
          description: Complete Library snapshot with current revision checksum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibrarySnapshot' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /drafts/{draftId}/library/images:
    parameters:
      - $ref: '#/components/parameters/DraftId'
      - $ref: '#/components/parameters/CheckoutToken'
      - $ref: '#/components/parameters/LibraryChecksum'
      - $ref: '#/components/parameters/LibraryRevision'
      - $ref: '#/components/parameters/LibraryRequestKey'
    post:
      operationId: uploadDraftLibraryImage
      description: >-
        Editor access, active owned checkout, exact saved revision, same-origin multipart request.
        Validates file bytes, extension, MIME, dimensions and fresh alt text. Creates one image
        item immediately in this draft. Accepted formats are JPEG, PNG, WebP and AVIF, at most
        5 MiB and 8000 pixels per side. Maximum multipart request size is 5308416 bytes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, altText]
              properties:
                file: { type: string, contentMediaType: application/octet-stream }
                altText: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '201':
          description: Uploaded image and committed owning draft revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryMutationResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /drafts/{draftId}/library/links:
    parameters:
      - $ref: '#/components/parameters/DraftId'
      - $ref: '#/components/parameters/CheckoutToken'
      - $ref: '#/components/parameters/LibraryChecksum'
      - $ref: '#/components/parameters/LibraryRevision'
      - $ref: '#/components/parameters/LibraryRequestKey'
    post:
      operationId: addDraftLibraryLink
      description: >-
        Editor access. Adds an independent linked-media record to the active owning draft.
        Requires an approved HTTPS image, direct video, or YouTube URL matching mediaType.
        The external resource remains hosted at its source; the record belongs to this draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryLinkInput' }
      responses:
        '201': { $ref: '#/components/responses/LibraryMutation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /drafts/{draftId}/library/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
      - $ref: '#/components/parameters/LibraryItemId'
      - $ref: '#/components/parameters/CheckoutToken'
      - $ref: '#/components/parameters/LibraryChecksum'
      - $ref: '#/components/parameters/LibraryRevision'
      - $ref: '#/components/parameters/LibraryRequestKey'
    patch:
      operationId: updateDraftLibraryItem
      description: >-
        Editor access. Updates metadata, archives, or unarchives one item in the owning active
        draft. Archiving changes Library visibility without changing placements or retained
        revisions. Unarchive preserves identity and metadata. The same item ID in another
        draft is outside this operation's ownership scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, metadata]
                  properties:
                    action: { type: string, const: update }
                    metadata: { $ref: '#/components/schemas/LibraryMetadata' }
                - type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: { type: string, enum: [archive, unarchive] }
      responses:
        '200': { $ref: '#/components/responses/LibraryMutation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteArchivedLibraryItem
      description: >-
        Editor access. Permanently deletes only an archived item after final confirmation.
        Returns a conflict explaining current placements, retained revisions, or pending candidate
        references that block deletion. Unarchive is the recovery path. Completed published
        copies are independent and do not alone block private source deletion. Whole-draft purge
        is a separate operation which removes all private history together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { type: boolean, const: true }
      responses:
        '200': { $ref: '#/components/responses/LibraryMutation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /drafts/{draftId}/library/items/{itemId}/replacement:
    parameters:
      - $ref: '#/components/parameters/DraftId'
      - $ref: '#/components/parameters/LibraryItemId'
      - $ref: '#/components/parameters/CheckoutToken'
      - $ref: '#/components/parameters/LibraryChecksum'
      - $ref: '#/components/parameters/LibraryRevision'
      - $ref: '#/components/parameters/LibraryRequestKey'
    post:
      operationId: replaceDraftLibraryImage
      description: >-
        Editor access. Replaces only an active image item, including linked images, after local
        validated preview and final irreversible confirmation. Preserves logical item identity,
        creates draft-owned immutable bytes, and atomically updates current placements in this
        draft. Linked images become uploaded images. Other drafts, retained revision snapshots,
        and independently published copies remain unchanged. No binary undo API is provided.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, altText, displayName, confirmed]
              properties:
                file: { type: string, contentMediaType: application/octet-stream }
                altText: { type: string, minLength: 1, maxLength: 300 }
                displayName: { type: string, minLength: 1, maxLength: 120 }
                tags:
                  type: string
                  description: JSON-encoded array, at most 20 tags of 1 to 40 characters each
                  default: '[]'
                confirmed: { type: string, const: 'true' }
      responses:
        '200': { $ref: '#/components/responses/LibraryMutation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /drafts/{draftId}/assets:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      operationId: readDraftOwnedAsset
      description: >-
        Authenticated Viewer access to immutable bytes owned by this draft, including retained
        historical paths. Cross-owner references and purged drafts/assets are not found.
        Published destinations never depend on this private endpoint. Global /media access is retired.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, pattern: '^/assets/' }
      responses:
        '200':
          description: Private image bytes with content type and no-store caching
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            image/avif:
              schema: { type: string, contentMediaType: image/avif }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /publish/staging:
    post:
      operationId: publishStaging
      description: >-
        Starts or resumes the exact preflighted candidate under the shared publication lease.
        Each request uploads at most 20 blobs and checkpoints completed blob identities.
        Returns 202 while work remains or 201 after every file is uploaded and the exact
        non-forced Staging branch update completes. Running is not release success.
        Continue the returned job with POST; GET never advances publishing.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draftId, expectedRevisionId, expectedRevisionChecksum, expectedBaseSha]
              properties:
                draftId: { type: string, format: uuid }
                expectedRevisionId: { type: string, format: uuid }
                expectedRevisionChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
                expectedBaseSha: { type: string, pattern: '^[a-f0-9]{40}$' }
      responses:
        '201':
          description: Staging candidate commit and durable publish job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StagingPublishResult' }
        '202':
          description: Upload checkpointed; continue the same job to finish publishing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StagingPublishProgress' }
        '409': { $ref: '#/components/responses/Error' }
  /publish/staging/preflight:
    post:
      operationId: preflightStaging
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draftId, expectedRevisionId, expectedRevisionChecksum]
              properties:
                draftId: { type: string, format: uuid }
                expectedRevisionId: { type: string, format: uuid }
                expectedRevisionChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '201':
          description: Private exact-revision preflight passed without a Staging write
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassedStagingPreflight' }
        '409': { $ref: '#/components/responses/Error' }
  /publish/staging/workflow:
    get:
      operationId: getStagingWorkflow
      parameters:
        - name: draftId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sanitized latest durable Staging workflow for this draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StagingWorkflowSnapshot' }
        '422': { $ref: '#/components/responses/Error' }
  /publish/staging/base:
    get:
      operationId: getStagingBase
      responses:
        '200':
          description: Exact current staging main commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitSha' }
  /publish/production:
    post:
      operationId: prepareProductionPullRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '403':
          description: Always disabled until production-preparation configuration and approval exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /publish/jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Exact publish job and evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishJob' }
  /publish/jobs/{jobId}/continue:
    post:
      operationId: continueStagingPublication
      description: >-
        Publisher or Administrator with repository publish permission. Requires same-origin JSON,
        Fetch Metadata and a valid Idempotency-Key. Advances only the existing exact candidate;
        accepts no draft data or replacement candidate. Revalidates the active lease, step ownership,
        saved revision, renderer contract, candidate checksum and Staging base before writes.
        Uploads at most 20 remaining blobs per request, checkpointing each completed blob identity.
        Repeat this POST while running; the same job resumes after reload. Finalizes the tree and
        commit only when all required local images and documents are uploaded. Concurrent steps
        or expired/inactive jobs conflict. GET status remains read only.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Complete candidate committed to Staging; verification follows separately
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StagingPublishResult' }
        '202':
          description: More upload work remains; progress is durably checkpointed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StagingPublishProgress' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: >-
            PUBLISH_STEP_UNAVAILABLE, PUBLISH_JOB_NOT_CLAIMABLE, DRAFT_REVISION_DRIFT,
            STAGING_BASE_DRIFT, PREFLIGHT_CANDIDATE_DRIFT or STAGING_RENDERER_MISMATCH.
            Conflicts never authorize a different candidate or bypass the shared lease.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /publish/jobs/{jobId}/verification:
    post:
      operationId: refreshStagingVerification
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Publish job with exact GitHub check evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishJob' }
  /approvals/production-base:
    get:
      operationId: getProductionBaseReadOnly
      responses:
        '200':
          description: Read-only observation of the production main commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitSha' }
  /approvals:
    post:
      operationId: recordApproval
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publishJobId, expectedTuple, decision]
              properties:
                publishJobId: { type: string, minLength: 1, maxLength: 100 }
                expectedTuple: { $ref: '#/components/schemas/CandidateTuple' }
                decision: { type: string, enum: [approved, rejected, revoked] }
                note: { type: string, maxLength: 500 }
      responses:
        '201': { description: Recorded approval }
        '409': { $ref: '#/components/responses/Error' }
  /approvals/eligibility:
    post:
      operationId: checkStagingEligibility
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tuple, observedProductionBaseSha]
              properties:
                tuple: { $ref: '#/components/schemas/CandidateTuple' }
                observedProductionBaseSha: { type: string, pattern: '^[a-f0-9]{40}$' }
      responses:
        '200': { description: Current exact-candidate eligibility }
  /admin/roles:
    get:
      operationId: listRoles
      responses:
        '200': { description: Active and disabled role mappings }
    put:
      operationId: upsertRole
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [githubLogin, role, active]
              properties:
                githubLogin: { type: string, pattern: '^[A-Za-z0-9-]{1,39}$' }
                role: { type: string, enum: [viewer, editor, publisher, administrator] }
                active: { type: boolean }
      responses:
        '200': { description: Role mapping }
  /admin/audit:
    get:
      operationId: listAudit
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200': { description: Paginated audit events }
  /admin/capacity:
    get:
      operationId: getCapacity
      responses:
        '200': { description: Storage and operation estimates with warning thresholds }
  /admin/asset-migration:
    get:
      operationId: getAssetOwnershipMigrationStatus
      description: >-
        Administrator-only, read-only ownership migration status. Returns aggregate counts and
        readiness without draft contents, private storage keys, or credentials. Migration execution
        is CLI-only; this API exposes no POST or other mutation operation.
      responses:
        '200':
          description: Asset ownership migration readiness and remaining aggregate work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetMigrationStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/retention:
    get:
      operationId: planRetention
      responses:
        '200': { description: Dry-run retention plan and checksummed export }
  /admin/retention/apply:
    post:
      operationId: applyRetention
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [exportChecksum]
              properties:
                exportChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200': { description: 'Applied exact, previously exported retention plan' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    githubSession:
      type: apiKey
      in: cookie
      name: __Secure-pointsite_builder_session
  parameters:
    LibraryRevision:
      name: X-Draft-Revision
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Exact current revision identity, required even when metadata changes leave the document checksum unchanged
    LibraryItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: Logical item identity, resolved only inside the owning draft
    LibraryChecksum:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[a-f0-9]{64}"$' }
      description: Exact saved revision checksum enclosed in double quotes
    LibraryRequestKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 100, pattern: '^[A-Za-z0-9._:-]{16,100}$' }
      description: Request identity bound to the draft and action; retries cannot replay purged content
    CheckoutToken:
      name: X-Draft-Checkout
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Opaque current editing-client token
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 100 }
  responses:
    LibraryMutation:
      description: Canonical Library state and committed owning draft revision
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LibraryMutationResult' }
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    AssetMigrationStatus:
      type: object
      additionalProperties: false
      required: [state, remainingDrafts, legacyAssets, legacyBytes, recoveredUploads]
      properties:
        state: { type: string, enum: [pending, complete] }
        remainingDrafts: { type: integer, minimum: 0 }
        legacyAssets: { type: integer, minimum: 0 }
        legacyBytes: { type: integer, minimum: 0 }
        recoveredUploads: { type: integer, minimum: 0 }
    DeletedDraftReceipt:
      type: object
      additionalProperties: false
      required: [id, status, deletedAt]
      description: Content-free receipt. Contains no draft name, document, media, links, or history.
      properties:
        id: { type: string, format: uuid }
        status: { type: string, const: deleted }
        deletedAt: { type: string, format: date-time }
    CheckoutClient:
      type: object
      additionalProperties: false
      required: [clientId]
      properties:
        clientId: { type: string, minLength: 16, maxLength: 100 }
    CheckoutAvailability:
      type: object
      additionalProperties: false
      required: [draftId, state, expiresAt]
      properties:
        draftId: { type: string, format: uuid }
        state: { type: string, enum: [available, owned, unavailable] }
        expiresAt: { type: [string, 'null'], format: date-time }
    Health:
      type: object
      required: [ok, environment, version]
      properties:
        ok: { type: boolean }
        environment: { type: string }
        version: { type: string }
    Actor:
      type: object
      required: [email, role]
      properties:
        email: { type: string, description: Canonical authenticated identity }
        displayName: { type: string }
        role: { type: string, enum: [viewer, editor, publisher, administrator] }
    DraftSummary:
      type: object
      required: [id, siteId, name, status, latestRevisionId, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, const: pointsite }
        name: { type: string }
        status: { type: string, enum: [active, archived, deleted] }
        latestRevisionId: { type: string, format: uuid }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
    DraftList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Draft' }
        nextCursor: { type: ['string', 'null'] }
    Draft:
      allOf:
        - $ref: '#/components/schemas/DraftSummary'
        - type: object
          required: [document, revision]
          properties:
            document: { $ref: '#/components/schemas/SiteDocument' }
            revision: { $ref: '#/components/schemas/Revision' }
    Revision:
      type: object
      required:
        [
          id,
          draftId,
          sequence,
          parentRevisionId,
          checksum,
          document,
          label,
          schemaVersion,
          rendererVersion,
          actionCategory,
          actionContext,
          createdBy,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        draftId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        parentRevisionId: { type: [string, 'null'], format: uuid }
        checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        document: { $ref: '#/components/schemas/SiteDocument' }
        schemaVersion: { type: integer }
        rendererVersion: { type: string }
        actionCategory:
          type: [string, 'null']
          enum:
            [
              text-edit,
              control-change,
              add,
              remove,
              duplicate,
              reorder,
              move,
              resize,
              replace,
              undo,
              redo,
              restore,
              null,
            ]
        actionContext:
          type: [string, 'null']
          enum:
            [
              page-content,
              page-details,
              page-structure,
              forms,
              library-attachment,
              linked-media,
              navigation,
              theme,
              site-settings,
              collections,
              section-settings,
              element-settings,
              element-layout,
              revision-history,
              draft,
              null,
            ]
        label: { type: [string, 'null'] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    DraftAction:
      type: object
      additionalProperties: false
      required: [category, context]
      properties:
        category:
          type: string
          enum:
            [
              text-edit,
              control-change,
              add,
              remove,
              duplicate,
              reorder,
              move,
              resize,
              replace,
              undo,
              redo,
              restore,
            ]
        context:
          type: string
          enum:
            [
              page-content,
              page-details,
              page-structure,
              forms,
              library-attachment,
              linked-media,
              navigation,
              theme,
              site-settings,
              collections,
              section-settings,
              element-settings,
              element-layout,
              revision-history,
              draft,
            ]
    RevisionList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Revision' }
        nextCursor: { type: ['string', 'null'] }
    LibraryMetadata:
      type: object
      additionalProperties: false
      required: [displayName, altText, tags]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        altText: { type: string, maxLength: 300 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 40 }
    LibraryLinkInput:
      type: object
      additionalProperties: false
      required: [displayName, altText, tags, mediaType, url]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        altText: { type: string, maxLength: 300 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 40 }
        mediaType: { type: string, enum: [image, video, youtube] }
        url: { type: string, format: uri, maxLength: 2000 }
    LibraryItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          mediaType,
          sourceType,
          displayName,
          filename,
          sourcePath,
          url,
          altText,
          tags,
          createdAt,
          updatedAt,
          archivedAt,
          usageCount,
          deleteBlockers,
        ]
      properties:
        id: { type: string }
        mediaType: { type: string, enum: [image, video, youtube] }
        sourceType: { type: string, enum: [managed, uploaded, linked] }
        displayName: { type: string }
        filename: { type: string }
        sourcePath:
          { type: string, description: 'Safe document source path, never a private storage key' }
        url:
          {
            type: string,
            description: Owner-scoped private image URL or approved external linked URL,
          }
        altText: { type: string }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
        usageCount: { type: integer, minimum: 0 }
        deleteBlockers:
          type: array
          description: Safe explanations of owning draft placements, retained revisions, or pending candidate references
          items: { type: string }
        width: { type: integer, minimum: 1, maximum: 8000 }
        height: { type: integer, minimum: 1, maximum: 8000 }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
    LibrarySnapshot:
      type: object
      additionalProperties: false
      required: [draftId, revisionId, revisionChecksum, items, activeCount, archivedCount]
      properties:
        draftId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        revisionChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        items:
          type: array
          description: Complete mixed inventory, including active and archived items; no 100-item cap
          items: { $ref: '#/components/schemas/LibraryItem' }
        activeCount: { type: integer, minimum: 0 }
        archivedCount: { type: integer, minimum: 0 }
    LibraryMutationResult:
      type: object
      additionalProperties: false
      required: [draft, library]
      properties:
        draft: { $ref: '#/components/schemas/Draft' }
        library: { $ref: '#/components/schemas/LibrarySnapshot' }
    SiteDocument:
      type: object
      required:
        [
          schemaVersion,
          rendererVersion,
          site,
          theme,
          navigation,
          pages,
          forms,
          media,
          linkedMedia,
          collections,
        ]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        rendererVersion: { type: string }
        site: { type: object }
        theme: { type: object }
        navigation: { type: array, items: { type: object } }
        pages: { type: array, items: { type: object } }
        forms: { type: array, items: { type: object } }
        media: { type: array, items: { type: object } }
        linkedMedia: { type: array, items: { type: object } }
        collections: { type: object }
    PublishJob:
      type: object
      required: [id, environment, status, candidateChecksum, requestedBy, requestedAt]
      properties:
        id: { type: string, format: uuid }
        environment: { type: string, enum: [staging, production-pr, production-merge, rollback] }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        candidateChecksum: { type: string }
        resultSha: { type: string }
        externalUrl: { type: string, format: uri }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        evidence: { type: object }
    GitSha:
      type: object
      additionalProperties: false
      required: [sha]
      properties:
        sha: { type: string, pattern: '^[a-f0-9]{40}$' }
    StagingWorkflowSnapshot:
      type: object
      additionalProperties: false
      required: [currentStagingSha, reviewUrl, preflight, availability, job, approval]
      properties:
        currentStagingSha: { type: string, pattern: '^[a-f0-9]{40}$' }
        reviewUrl: { type: string, format: uri }
        preflight: { $ref: '#/components/schemas/StagingPreflightSummary' }
        availability: { $ref: '#/components/schemas/StagingAvailability' }
        job:
          oneOf:
            - $ref: '#/components/schemas/StagingWorkflowJob'
            - type: 'null'
        approval:
          oneOf:
            - $ref: '#/components/schemas/StagingAcceptanceSummary'
            - type: 'null'
    PassedStagingPreflight:
      type: object
      additionalProperties: false
      required: [state, revisionId, revisionChecksum, candidateChecksum, validatedAt]
      properties:
        state: { type: string, const: passed }
        revisionId: { type: string, format: uuid }
        revisionChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        candidateChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        validatedAt: { type: string, format: date-time }
    StagingPreflightSummary:
      oneOf:
        - $ref: '#/components/schemas/PassedStagingPreflight'
        - type: object
          additionalProperties: false
          required: [state, reason]
          properties:
            state: { type: string, const: required }
            reason:
              type: string
              enum: [not-validated, revision-changed, renderer-contract-changed, failed]
    StagingAvailability:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { type: string, const: available }
        - type: object
          additionalProperties: false
          required: [state, phase, retryAt]
          properties:
            state: { type: string, const: busy }
            phase: { type: string, enum: [queued, running] }
            retryAt: { type: string, format: date-time }
    StagingWorkflowJob:
      type: object
      additionalProperties: false
      required:
        [
          id,
          status,
          candidateChecksum,
          draftId,
          revisionId,
          revisionChecksum,
          schemaVersion,
          rendererVersion,
          stagingBaseSha,
          requestedAt,
          evidence,
        ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        candidateChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        draftId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        revisionChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        schemaVersion: { type: integer, minimum: 1 }
        rendererVersion: { type: string }
        stagingBaseSha: { type: string, pattern: '^[a-f0-9]{40}$' }
        stagingCommitSha:
          oneOf:
            - type: string
              pattern: '^[a-f0-9]{40}$'
            - type: 'null'
        commitUrl:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        requestedAt: { type: string, format: date-time }
        completedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        evidence: { type: object }
    StagingAcceptanceSummary:
      type: object
      additionalProperties: false
      required: [id, publishJobId, decision, createdAt]
      properties:
        id: { type: string, format: uuid }
        publishJobId: { type: string, format: uuid }
        decision: { type: string, enum: [approved, rejected, revoked] }
        createdAt: { type: string, format: date-time }
    CandidateTuple:
      type: object
      additionalProperties: false
      required:
        [
          siteId,
          revisionId,
          revisionChecksum,
          schemaVersion,
          rendererVersion,
          candidateChecksum,
          stagingBaseSha,
          stagingCommitSha,
          productionBaseSha,
        ]
      properties:
        siteId: { type: string, const: pointsite }
        revisionId: { type: string, format: uuid }
        revisionChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        schemaVersion: { type: integer, minimum: 1 }
        rendererVersion: { type: string }
        candidateChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        stagingBaseSha: { type: string, pattern: '^[a-f0-9]{40}$' }
        stagingCommitSha: { type: string, pattern: '^[a-f0-9]{40}$' }
        productionBaseSha: { type: string, pattern: '^[a-f0-9]{40}$' }
    StagingPublishProgress:
      type: object
      additionalProperties: false
      required: [environment, jobId, status, uploaded, total, candidateChecksum]
      description: Content-free upload progress; excludes private bytes, source documents, credentials and internal checkpoints.
      properties:
        environment: { type: string, const: staging }
        jobId: { type: string, format: uuid }
        status: { type: string, const: running }
        uploaded: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        candidateChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
    StagingPublishResult:
      type: object
      additionalProperties: false
      required:
        [
          environment,
          siteId,
          revisionId,
          revisionChecksum,
          schemaVersion,
          rendererVersion,
          candidateChecksum,
          baseSha,
          stagingBaseSha,
          commitSha,
          url,
          requestedBy,
          status,
        ]
      properties:
        environment: { type: string, const: staging }
        siteId: { type: string, const: pointsite }
        revisionId: { type: string, format: uuid }
        revisionChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        schemaVersion: { type: integer, minimum: 1 }
        rendererVersion: { type: string }
        candidateChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        baseSha: { type: string, pattern: '^[a-f0-9]{40}$' }
        stagingBaseSha: { type: string, pattern: '^[a-f0-9]{40}$' }
        commitSha: { type: string, pattern: '^[a-f0-9]{40}$' }
        url: { type: string, format: uri }
        jobId: { type: string }
        requestedBy: { type: string }
        status: { type: string, const: succeeded }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
