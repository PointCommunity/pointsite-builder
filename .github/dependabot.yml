version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:37'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      security-dependencies:
        applies-to: security-updates
        patterns: ['*']
      runtime-and-tooling:
        applies-to: version-updates
        patterns: ['*']
        # Puck's source-hash-verified history patch needs a separate upgrade review.
        exclude-patterns: ['@puckeditor/core']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:47'
      timezone: America/Chicago
    open-pull-requests-limit: 3
