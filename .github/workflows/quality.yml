name: Quality

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run contract:lint
      - run: npm run verify:runbooks
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:performance
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

      - name: Upload test and build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: builder-quality-${{ github.sha }}
          path: |
            coverage/
            dist/
            artifacts/
          if-no-files-found: warn
          retention-days: 14

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - run: npm ci
      - name: Block high and critical dependency advisories
        run: npm audit --audit-level=high

  secret-security:
    name: Secret security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan changed commits for credentials
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --results=verified,unknown

  source-security:
    name: Source security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.176.1

      - name: Scan TypeScript and JavaScript
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: >-
          semgrep scan
          --config p/typescript
          --config p/javascript
          --config p/owasp-top-ten
          --error
          --exclude worker-configuration.d.ts
          src worker tests
